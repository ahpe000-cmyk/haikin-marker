name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # JST 6:00 / 12:00 / 18:00 / 24:00 に共有脳を再取得してデプロイ
    - cron: '0 21,3,9,15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build ARC dashboard
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/arc
          cp index.html CNAME _site/
          cp -r web/dist/. _site/arc/
      - name: Fetch shared brain from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
        run: node scripts/fetch-brain.mjs _site/arc/brain.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
